version: 2

project_name: agentpassage

builds:
  - id: apx
    main: ./cmd/apx
    binary: apx
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "apx_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
